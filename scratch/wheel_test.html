<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .wheel-container { position: relative; width: 420px; height: 420px; }
    .outer-wheel {
      position: absolute; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      border: 6px solid rgba(255, 255, 255, 0.1);
    }
    .segment {
      position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%;
      display: flex; justify-content: center; align-items: center;
    }
    .segment-content {
      text-align: center;
      padding-bottom: 70px;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .inner-wheel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 220px; height: 220px; background: #1e293b; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2); z-index: 10;
    }
  </style>
</head>
<body>
  <div class="wheel-container" id="wheel"></div>
  <script>
    const leaders = [{id: 'L1', name: 'Leader1'}, {id: 'L2', name: 'Leader2'}, {id: 'L3', name: 'Leader3'}];
    const members = [
      {id: 'M1', names: ['Mem1A', 'Mem1B']},
      {id: 'M2', names: ['Mem2A', 'Mem2B']},
      {id: 'M3', names: ['Mem3A', 'Mem3B']}
    ];
    
    const numSegments = leaders.length;
    const angleStep = 360 / numSegments;
    const colors = ['#6366f1', '#8b5cf6', '#ec4899'];
    
    let html = '<div class="outer-wheel">';
    members.forEach((member, i) => {
      const rotate = i * angleStep;
      const skewY = 90 - angleStep;
      
      const displayNames = member.names;
      const namesHtml = displayNames.map(n => `<div style="margin-bottom: 4px;">${n}</div>`).join('');
      
      html += `
        <div class="segment" style="transform: rotate(${rotate}deg) skewY(-${skewY}deg); background-color: ${colors[i]};">
          <div class="segment-content" style="transform: skewY(${skewY}deg) rotate(${angleStep/2}deg)">
            <div style="display: flex; flex-direction: column; align-items: center;">
              ${namesHtml}
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    
    html += '<div class="inner-wheel" style="position: relative;">';
    leaders.forEach((leader, i) => {
      html += `
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(${i * angleStep}deg) translateY(-80px); font-weight: 900; font-size: 1rem;">
          ${leader.name}
        </div>
      `;
    });
    html += '</div>';
    
    document.getElementById('wheel').innerHTML = html;
  </script>
</body>
</html>
